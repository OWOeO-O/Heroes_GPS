<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Data Analysis</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
        }

        h2.title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            padding: 18px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
        }

        th {
            background-color: #007BFF;
            color: #fff;
            font-weight: bold;
        }

        td {
            background-color: #f9f9f9;
            color: #555;
            border-radius: 8px;
        }

        tr:nth-child(even) {
            background-color: #f1f1f1;
        }

        tr:hover {
            background-color: #e7f1ff;
        }

        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-bar input {
            padding: 12px 18px;
            font-size: 16px;
            width: 250px;
            border-radius: 6px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .search-bar button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .search-bar button:hover {
            background-color: #0056b3;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #007BFF;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title">GPS Data Analysis</h2>

    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by Subject No..." />
        <button class="search-button" onclick="filterTable()">Search</button>
    </div>

    <div class="loading" id="loading" style="display: none;">Loading data...</div>

    <table id="data-table">
        <thead>
            <tr>
                <th>Subject No</th>
                <th>Display No</th>
                <th>Initial Name</th>
                <th>Total Distance (km)</th>
                <th>Unique Dates</th>
                <th>Average Distance per Day (km)</th>
                <th>Home Location (Lat/Lon)</th>
                <th>Weekend Outing Count</th>
                <th>Total Weekend Outing Time (min)</th>
                <th>Stay Locations (Lat/Lon)</th>
                <th>Movement Pattern</th>
            </tr>
        </thead>
        <tbody>
            <!-- 데이터가 여기에 동적으로 삽입됩니다 -->
        </tbody>
    </table>
</div>

<script>
    let globalData = [];  // 데이터를 전역으로 저장

    async function getGpsData() {
        try {
            document.getElementById("loading").style.display = "block";  // 로딩 화면 표시
            const response = await fetch('http://127.0.0.1:8001/gps-data');  // FastAPI 서버 주소에 맞게 변경
            const data = await response.json();  // 응답을 JSON 형식으로 파싱

            console.log(data);  // 데이터가 받아졌는지 확인하기 위해 바로 출력

            globalData = data.result;  // API에서 반환되는 전체 데이터를 저장
            populateTable(globalData);  // 테이블에 데이터 삽입

            document.getElementById("loading").style.display = "none";  // 로딩 화면 숨기기
        } catch (error) {
            console.error("Error fetching GPS data:", error);
            document.getElementById("loading").innerText = "Error!!";
        }
    }

    function populateTable(data) {
        const tableBody = document.getElementById("data-table").getElementsByTagName("tbody")[0];
        tableBody.innerHTML = "";  // 기존 테이블 내용 비우기

        data.forEach(async (item) => {
            const row = tableBody.insertRow();  // 새로운 행 추가

            row.insertCell(0).textContent = item.subject_no || " ";  // Subject No
            row.insertCell(1).textContent = item.display_no || " ";  // Display No
            row.insertCell(2).textContent = item.initial_name || " ";  // Initial Name
            row.insertCell(3).textContent = item.total_distance.toFixed(2);  // Total Distance
            row.insertCell(4).textContent = item.unique_dates || " 0 ";  // Unique Dates
            row.insertCell(5).textContent = item.average_distance_per_day.toFixed(2);  // Avg Distance per Day
            row.insertCell(6).textContent = `Lat: ${item.home_location[0]}, Lon: ${item.home_location[1]}`;  // Home Location
            row.insertCell(7).textContent = item.holiday_outing_count || " 0 ";  // Holiday Outing Count
            row.insertCell(8).textContent = item.total_holiday_outing_time || " 0 ";  // Total Outing Time
            row.insertCell(9).textContent = (item.stay_locations && Array.isArray(item.stay_locations))
            ? item.stay_locations.flat()  // 이중 배열이 있다면 평탄화
                .filter(loc => loc.visit_count >= 1)  // 방문 횟수 2 이상만 필터링
                .map(loc => `${loc.category_name || "Unknown"} - 머문 시간: ${Math.floor(loc.total_time / 60)} 위치: "${loc.latitude}, ${loc.longitude}"`)
                .join(', ')
            : "0";
        
     //       row.insertCell(10).textContent = Array.isArray(movement_pattern)
       //     ? movementData
         //       .map(m => `${m.category_name || "Unknown"} - ${Math.floor(m.total_time / 60)}분 위치: "${m.latitude}, ${m.longitude}"`)
           //     .join(', ')
           // : "0";
            
          });
    }

    function filterTable() {
        const searchValue = document.getElementById("searchInput").value.toLowerCase();
        const filteredData = globalData.filter(item => item.subject_no.toString().includes(searchValue));
        populateTable(filteredData);
    }

    window.onload = async function() {
        await getGpsData();
    };
</script>

</body>
</html>
