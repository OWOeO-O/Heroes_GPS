<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GPS Data Analysis</title>
    <link rel="stylesheet" type="text/css" href="test.css">
</head>
<body>

<div class="container">
    <h2 class="title">GPS Data Analysis</h2>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by Subject No..." />
        <button onclick="filterTable()">Search</button>
    </div>

    <div class="loading" id="loading" style="display: none;">Loading data...</div>
    <table id="data-table">
        <thead>
            <tr>
                <th>Subject No</th> <th>Display No</th>
                <th>Initial Name</th> <th>총 이동거리 (km)</th>
                <th>날짜 수 <br>(일)</th>
                <th>[디지털활동반경] <br>(일 별 ) (km)</th>
                <th>Home Location (Lat/Lon)</th>
                <th>Weekend Outing Count <br> (* 주말 총 외출 횟수 )</th>
                <th>Total Weekend Outing Time (min) <br> (* 주말 총 외출 시간)</th>
                <th>[디지털이동다양성]</th>
                <th>[디지털이동규칙성]</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    let currentPage = 1;
    const rowsPerPage = 10;
    let totalItems = 0;
    let globalData = [];

    async function getGpsData() {
        try {
            // ✅ 로딩 표시
            document.getElementById("loading").style.display = "block";
    
            // ✅ 버튼 비활성화 (중복 클릭 방지)
            document.querySelectorAll("#pagination button").forEach(btn => btn.disabled = true);
    
            const response = await fetch(`http://127.0.0.1:8001/gps-data?page=${currentPage}&size=${rowsPerPage}`);
            const data = await response.json();
    
            globalData = data.result || [];
            totalItems = data.total_count || 0;
    
            populateTable(globalData);
            updatePaginationButtons(totalItems);
    
            // ✅ 로딩 끝났을 때
            document.getElementById("loading").style.display = "none";
            document.querySelectorAll("#pagination button").forEach(btn => btn.disabled = false);
    
        } catch (error) {
            console.error("Error fetching GPS data:", error);
            document.getElementById("loading").innerText = "데이터를 불러오는 중 오류가 발생했습니다.";
        }
    }
    
    
    

    function populateTable(data) {
        const tableBody = document.getElementById("data-table").getElementsByTagName("tbody")[0];
        tableBody.innerHTML = "";

        data.forEach(item => {
            const row = tableBody.insertRow();
            row.insertCell(0).textContent = item.subject_no || "";
            row.insertCell(1).textContent = item.display_no || "";
            row.insertCell(2).textContent = item.initial_name || "";
            row.insertCell(3).textContent = item.total_distance?.toFixed(2) || "0.00";
            const analysisPeriod = item.analysis_period || {};

            function getSafeDate(value) {
                return value && value.trim ? value : "Not Available";
            }
            
            const startDate = getSafeDate(analysisPeriod.visit_start_date);
            const endDate = getSafeDate(analysisPeriod.visit_end_date);
            const durationDays = analysisPeriod.duration_days || "0";
            
            // 기존대로 표에 채우기
            row.insertCell(4).innerHTML = `${item.unique_dates || "0"}<br>( Start Date: ${startDate}<br>End Date: ${endDate} )`;
            
            row.insertCell(5).textContent = item.average_distance_per_day
                ? `${item.average_distance_per_day.toFixed(2)} km`
                : "";
            
            row.insertCell(6).textContent = item.home_location
                ? `Lat: ${item.home_location[0]}, Lon: ${item.home_location[1]}`
                : "";
            
            // 7번째 셀: 주말 외출 횟수 + 전체 기간 일수
            row.insertCell(7).innerHTML = `${item.holiday_outing_count || "0"}회<br>(총 ${durationDays}일)`;

            row.insertCell(8).textContent = item.total_holiday_outing_time || "0";
            
            // 이동 다양성
            let stayLocations = item.stay_locations;
            if (typeof stayLocations === "string") {
                try {
                    stayLocations = JSON.parse(stayLocations);
                } catch (e) {
                    console.error("Invalid stay_locations JSON", stayLocations);
                    stayLocations = [];
                }
            }
            row.insertCell(9).innerHTML = renderLocationList(stayLocations);

            // 이동 규칙성
            let movementPattern = item.movement_pattern;
            if (typeof movementPattern === "string") {
                try {
                    movementPattern = JSON.parse(movementPattern);
                } catch (e) {
                    console.error("Invalid movement_pattern JSON", movementPattern);
                    movementPattern = [];
                }
            }
            row.insertCell(10).innerHTML = renderLocationList(movementPattern);
        });
    }

    function renderLocationList(locations) {
        if (!locations || !Array.isArray(locations)) return "0";
        const flatLocations = Array.isArray(locations[0]) ? locations.flat() : locations;
    
        const validItems = flatLocations.filter(loc =>
            typeof loc === 'object' &&
            loc.latitude !== undefined &&
            loc.longitude !== undefined &&
            loc.total_time !== undefined
        );
    
        if (validItems.length === 0) return "0";
    
        const categoryData = validItems.reduce((acc, loc) => {
            const category = loc.category_name || "Unknown";
            if (!acc[category]) {
                acc[category] = { totalTime: 0, totalDistance: 0, count: 0, visitDays: new Set() };
            }
            acc[category].totalTime += loc.total_time;
            acc[category].totalDistance += loc.total_distance;
            acc[category].count += 1;
            acc[category].visitDays.add(loc.date);
            return acc;
        }, {});
    
        const categoryDetails = Object.keys(categoryData).map((category, idx) => {
            const { totalTime, totalDistance, count, visitDays } = categoryData[category];
            const avgDistanceInKm = totalDistance / count;
            const distance = avgDistanceInKm.toFixed(2);
    
            const avgTimeInMinutes = Math.floor(totalTime / count / 60);
            const hours = Math.floor(avgTimeInMinutes / 60);
            const minutes = avgTimeInMinutes % 60;
            const time = hours > 0 ? `${hours}시간 ${minutes}분` : `${minutes}분`;
    
            const visitDaysCount = visitDays.size;
    
            const avgDailyTimeInMinutes = Math.floor(totalTime / visitDaysCount / 60);
            const dailyHours = Math.floor(avgDailyTimeInMinutes / 60);
            const dailyMinutes = avgDailyTimeInMinutes % 60;
            const dailyTime = dailyHours > 0 ? `${dailyHours}시간 ${dailyMinutes}분` : `${dailyMinutes}분`;
    
            // 동그라미 숫자 유니코드 (1~20까지만 처리)
            const circleNumbers = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫", "⑬", "⑭", "⑮", "⑯", "⑰", "⑱", "⑲", "⑳"];
            const circleNumber = circleNumbers[idx] || `${idx + 1}.`;
    
            return `
                <li>
                    <strong>${circleNumber} ${category}</strong><br>
                    🕒 시간: ${time}<br>
                    🔢 방문 횟수: ${count}회<br>
                    📅 방문 일수: ${visitDaysCount}일<br>
                    🗓 하루 평균 머문 시간: ${dailyTime} (일 평균)
                </li>
            `;
        }).join('');
    
        return `<ul>${categoryDetails}</ul>`;
    }
    
    function updatePaginationButtons(totalRows, dataSource = null) {
        const totalPages = Math.ceil(totalRows / rowsPerPage);
        const paginationDiv = document.getElementById("pagination");
        paginationDiv.innerHTML = "";
    
        for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement("button");
            button.textContent = i;
            button.classList.toggle("active", i === currentPage);
            button.onclick = () => {
                currentPage = i;
    
                  // 📌 테이블 위로 스크롤!
             document.getElementById("data-table").scrollIntoView({ behavior: "smooth", block: "start" });

            if (dataSource) {
                const start = (currentPage - 1) * rowsPerPage;
                 const end = start + rowsPerPage;
                 const pageData = dataSource.slice(start, end);
                     populateTable(pageData);
                    updatePaginationButtons(totalRows, dataSource);
          } else {
             getGpsData();
                }
            };
            paginationDiv.appendChild(button);
        }
    }
    

    function filterTable() {
        const searchValue = document.getElementById("searchInput").value.toLowerCase();
        const filteredData = globalData.filter(item =>
            item.subject_no?.toString().toLowerCase().includes(searchValue)
        );
    
        currentPage = 1;
        totalItems = filteredData.length;
    
        // 필터된 데이터에서 currentPage에 맞는 부분만 보여줌
        const paginatedData = filteredData.slice(0, rowsPerPage);
        populateTable(paginatedData);
        updatePaginationButtons(totalItems, filteredData);
    }
    

    window.onload = getGpsData;
</script>

</body>
</html>
